<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Караван добра — Jungle Bass (Караоке Клип)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Russo+One&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c0a;
      --card-bg: rgba(15, 22, 18, 0.82);
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --rasta-green: #10b981;
      --rasta-green-bright: #34d399;
      --rasta-red: #ef4444;
      --text-dim: #94a3b8;
      --border-glow: rgba(16, 185, 129, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: #f1f5f9;
      font-family: 'Russo One', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Art with Blur and Smoke */
    .ambient-bg {
      position: fixed;
      inset: -20px;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.12) 0%, rgba(9, 12, 10, 0.95) 75%),
                  url('bg.jpg') center/cover no-repeat;
      filter: blur(8px) brightness(0.35) contrast(1.2);
      z-index: 0;
      transform: scale(1.05);
      transition: transform 0.2s ease-out;
    }

    /* Noise Texture Overlay */
    .grain-overlay {
      position: fixed;
      inset: 0;
      background-image: repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,0.015) 0, rgba(0,0,0,0.03) 1px, transparent 2px);
      pointer-events: none;
      z-index: 1;
    }

    /* App Container */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 980px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Street Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(12, 18, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }

    .track-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag-pill {
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      padding: 5px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.18);
      color: var(--rasta-green-bright);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .tag-audio {
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 0.08em;
    }

    .bpm-counter {
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
      animation: pulse-beat 1.33s infinite ease-in-out;
    }
    @keyframes pulse-beat {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Main Showcase: Stage + Lyrics */
    .showcase-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    @media (max-width: 840px) {
      .showcase-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Stage Card: Artwork & Visualizer */
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .artwork-frame {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.12);
      transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .artwork-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .artwork-frame.bass-pump {
      transform: scale(1.025);
      border-color: var(--rasta-green-bright);
      box-shadow: 0 16px 36px rgba(16, 185, 129, 0.4);
    }

    /* Tape / Street Vinyl Overlay */
    .vinyl-ribbon {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 24px 14px 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .tape-title {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 15px;
      color: #fff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .tape-sub {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      color: var(--gold-bright);
      font-weight: 700;
    }

    /* Real-Time Spectrum Canvas */
    .spectrum-container {
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px;
    }
    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Right Card: Kinetic Lyric Cinema */
    .kinetic-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    /* Active Punch Lyric Viewport */
    .hero-lyric-box {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(245, 158, 11, 0.08) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      margin-bottom: 20px;
      position: relative;
    }

    .hero-badge {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-text {
      font-family: 'Dela Gothic One', cursive, sans-serif;
      font-size: 28px;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8),
                   0 0 24px rgba(16, 185, 129, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-text.chorus-mode {
      color: var(--gold-bright);
      text-shadow: 0 4px 20px rgba(0,0,0,0.9),
                   0 0 35px rgba(245, 158, 11, 0.6);
      font-size: 30px;
    }

    .hero-next {
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin-top: 10px;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scrollable Lyrics Flow */
    .lyrics-stream {
      flex: 1;
      max-height: 270px;
      overflow-y: auto;
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--rasta-green) transparent;
    }
    .lyrics-stream::-webkit-scrollbar {
      width: 5px;
    }
    .lyrics-stream::-webkit-scrollbar-thumb {
      background: var(--rasta-green);
      border-radius: 4px;
    }

    .lyric-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 12px;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid transparent;
    }
    .lyric-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .lyric-time {
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      min-width: 44px;
    }

    .lyric-string {
      font-family: 'Russo One', sans-serif;
      font-size: 15px;
      color: #cbd5e1;
      letter-spacing: 0.02em;
      line-height: 1.4;
      transition: all 0.2s;
    }

    .lyric-item.active {
      background: rgba(16, 185, 129, 0.12);
      border-left: 3px solid var(--rasta-green-bright);
      transform: translateX(4px);
    }
    .lyric-item.active .lyric-time {
      color: var(--gold-bright);
    }
    .lyric-item.active .lyric-string {
      color: #ffffff;
      font-size: 16px;
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }

    .lyric-item.chorus {
      background: rgba(245, 158, 11, 0.04);
    }
    .lyric-item.chorus.active {
      background: rgba(245, 158, 11, 0.15);
      border-left: 3px solid var(--gold-bright);
    }
    .lyric-item.chorus.active .lyric-string {
      color: var(--gold-bright);
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 16px;
    }

    /* Player Controls Bar */
    .controls-card {
      background: rgba(12, 18, 14, 0.9);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--rasta-green) 0%, var(--gold) 100%);
      border-radius: 4px;
      position: relative;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }
    .progress-handle {
      position: absolute;
      right: -6px;
      top: -4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rasta-green-bright) 0%, #059669 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.75);
    }
    .play-btn svg {
      width: 24px;
      height: 24px;
      fill: #090c0a;
    }

    .time-digits {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.05em;
    }

    .sound-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sub-meter {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 16px;
    }
    .sub-bar {
      width: 4px;
      height: 4px;
      background: var(--rasta-green);
      border-radius: 1px;
      transition: height 0.1s ease;
    }
  </style>
</head>
<body>
  <div class="ambient-bg" id="ambientBg"></div>
  <div class="grain-overlay"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header-bar">
      <div class="track-badge">
        <span class="tag-pill">JUNGLE BASS</span>
        <span class="tag-audio">OFFSTEP MASTER • 24-BIT</span>
      </div>
      <div class="bpm-counter">
        <div class="pulse-dot"></div>
        <span>85 BPM • 432 HZ VIBE</span>
      </div>
    </header>

    <!-- Showcase Grid -->
    <div class="showcase-grid">
      <!-- Left: Artwork & Spectrum -->
      <div class="stage-card">
        <div class="artwork-frame" id="artFrame">
          <img src="bg.jpg" alt="Караван добра арт">
          <div class="vinyl-ribbon">
            <div>
              <div class="tape-title">Караван Добра</div>
              <div class="tape-sub">РАСТАФАРАЙ • ДАКОТА</div>
            </div>
            <div class="tag-pill" style="font-size:9px; padding:3px 8px;">4:20</div>
          </div>
        </div>

        <div class="spectrum-container">
          <canvas id="visualizer"></canvas>
        </div>
      </div>

      <!-- Right: Kinetic Lyrics Cinema -->
      <div class="kinetic-card">
        <div class="hero-lyric-box">
          <div class="hero-badge" id="heroBadge">⚡ [ ТРЕК ГОТОВ К ВОСПРОИЗВЕДЕНИЮ ]</div>
          <div class="hero-text" id="heroText">НАЖМИ PLAY ДЛЯ СТАРТА</div>
          <div class="hero-next" id="heroNext">караоке синхронизировано со звуком</div>
        </div>

        <div class="lyrics-stream" id="lyricsStream"></div>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-card">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>

      <div class="controls-row">
        <div class="time-digits" id="timeCurrent">00:00</div>
        
        <button class="play-btn" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
        </button>

        <div class="sound-badge">
          <div class="time-digits" id="timeDuration">02:13</div>
          <div class="sub-meter">
            <div class="sub-bar" id="sb1"></div>
            <div class="sub-bar" id="sb2"></div>
            <div class="sub-bar" id="sb3"></div>
            <div class="sub-bar" id="sb4"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" src="audio.mp3" preload="metadata"></audio>

  <script>
    // Lyrics timeline
    const lyricsData = [
      { start: 0.0, end: 9.0, type: "intro", badge: "ИНТРО", text: "♫ [Интро • Врубай кач] ♫" },
      { start: 9.0, end: 14.0, type: "verse", badge: "РАЗГОН", text: "Йо-йо! Врубай кач..." },
      { start: 14.0, end: 17.8, type: "verse", badge: "КУПЛЕТ 1", text: "Я забываюсь, скрутив блант, во дворах Дакоты" },
      { start: 17.8, end: 22.0, type: "verse", badge: "КУПЛЕТ 1", text: "В умах музыки много, всем наведем погоду" },
      { start: 22.0, end: 26.5, type: "verse", badge: "КУПЛЕТ 1", text: "ИнДаХуд бывалый спросит ганджи, на падике нажигать буду" },
      { start: 26.5, end: 29.5, type: "verse", badge: "КУПЛЕТ 1", text: "Ответ без фальши — есть" },
      { start: 29.5, end: 34.5, type: "verse", badge: "КУПЛЕТ 1", text: "Подходи дунем, да возьмешь с собой, я не скуплюсь на настрой" },
      { start: 34.5, end: 39.5, type: "verse", badge: "КУПЛЕТ 1", text: "Даже голодной весной, постой, не дело дунуть и сбежать, брат" },
      { start: 39.5, end: 44.5, type: "verse", badge: "КУПЛЕТ 1", text: "За дела, за жизнь расскажи, присядь, да не иссякнет твой рай" },
      { start: 44.5, end: 49.5, type: "verse", badge: "КУПЛЕТ 1", text: "Как под откос не пускай, ман взлетай, Джа повéдал нам растафарай" },
      { start: 49.5, end: 57.0, type: "chorus", badge: "ПРИПЕВ ★", text: "ПСАМ ВАВИЛОНА НЕ НАГНАТЬ ТУТ НАС" },
      { start: 57.0, end: 64.5, type: "chorus", badge: "ПРИПЕВ ★", text: "ПОКА КАРАВАН ДОБРА ВЕЗЕТ ЭТОТ ГАНДЖУБАС" },
      { start: 64.5, end: 71.5, type: "verse", badge: "КУПЛЕТ 2", text: "Джа поможет мне курить и стареть, формула одна приготовления" },
      { start: 71.5, end: 77.0, type: "verse", badge: "КУПЛЕТ 2", text: "Ман, постой, не нуди, дабы мы тут качали под звуки души" },
      { start: 77.0, end: 81.5, type: "verse", badge: "КУПЛЕТ 2", text: "Тепла бомбаклат, взрыв надо миновать дни" },
      { start: 81.5, end: 85.5, type: "verse", badge: "КУПЛЕТ 2", text: "Наше поколение раста в раше, не имеет соблазна: «Как же прожить без ганджи?»" },
      { start: 85.5, end: 89.5, type: "verse", badge: "КУПЛЕТ 2", text: "Даже преграды нет в кашле, я вижу в каждом в диге бессонные ночи" },
      { start: 89.5, end: 93.0, type: "verse", badge: "КУПЛЕТ 2", text: "Ведь 4:20 ждет с напасом к себе в гости" },
      { start: 93.0, end: 97.0, type: "verse", badge: "КУПЛЕТ 2", text: "Мы не прайд, подарим навалóм эмоций вам, навалим идей, волна позитива смеха" },
      { start: 97.0, end: 101.5, type: "verse", badge: "КУПЛЕТ 2", text: "Лавина напала на массу людей. Лица доброты, руки в небо ввысь" },
      { start: 101.5, end: 107.0, type: "verse", badge: "КУПЛЕТ 2", text: "Я — аяман, тот прохожий, что встречает с улыбкой весь мир" },
      { start: 107.0, end: 113.5, type: "verse", badge: "КУПЛЕТ 2", text: "Леса доброты, руки в небо ввысь. Я — аяман, тот прохожий, что встречает с улыбкой весь мир" },
      { start: 113.5, end: 120.5, type: "chorus", badge: "ПРИПЕВ ★", text: "ПСАМ ВАВИЛОНА НЕ НАГНАТЬ ТУТ НАС" },
      { start: 120.5, end: 128.5, type: "chorus", badge: "ПРИПЕВ ★", text: "ПОКА КАРАВАН ДОБРА ВЕЗЕТ ЭТОТ ГАНДЖУБАС" },
      { start: 128.5, end: 133.7, type: "outro", badge: "АУТРО", text: "КАРАВАН ДОБРА • JUNGLE BASS MASTER" }
    ];

    // DOM Elements
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');
    const heroBadge = document.getElementById('heroBadge');
    const heroText = document.getElementById('heroText');
    const heroNext = document.getElementById('heroNext');
    const lyricsStream = document.getElementById('lyricsStream');
    const artFrame = document.getElementById('artFrame');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const sb1 = document.getElementById('sb1');
    const sb2 = document.getElementById('sb2');
    const sb3 = document.getElementById('sb3');
    const sb4 = document.getElementById('sb4');

    // Populate Lyrics List
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    lyricsData.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = `lyric-item ${item.type === 'chorus' ? 'chorus' : ''}`;
      row.dataset.index = index;
      row.innerHTML = `
        <span class="lyric-time">${formatTime(item.start)}</span>
        <span class="lyric-string">${item.text}</span>
      `;
      row.addEventListener('click', () => {
        audio.currentTime = item.start;
        if (audio.paused) playAudio();
      });
      lyricsStream.appendChild(row);
    });

    // Audio Context & Analyser
    let audioCtx, analyser, source, dataArray;
    function setupWebAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      resizeCanvas();
      drawVisualizer();
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;
      analyser.getByteFrequencyData(dataArray);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barCount = 24;
      const barWidth = (canvas.width / barCount) - 2;

      // Sub-bass thump calculation (low bins 0..3)
      const subBass = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
      if (subBass > 185) {
        artFrame.classList.add('bass-pump');
      } else {
        artFrame.classList.remove('bass-pump');
      }

      // Small meters
      sb1.style.height = `${Math.min(16, (dataArray[0]/255) * 16)}px`;
      sb2.style.height = `${Math.min(16, (dataArray[1]/255) * 16)}px`;
      sb3.style.height = `${Math.min(16, (dataArray[3]/255) * 16)}px`;
      sb4.style.height = `${Math.min(16, (dataArray[6]/255) * 16)}px`;

      for (let i = 0; i < barCount; i++) {
        const value = dataArray[i] || 0;
        const barHeight = (value / 255) * canvas.height * 0.9;
        const x = i * (barWidth + 2);
        const y = canvas.height - barHeight;

        // Gradient from Green to Gold
        const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
        grad.addColorStop(0, '#10b981');
        grad.addColorStop(0.7, '#f59e0b');
        grad.addColorStop(1, '#ef4444');

        ctx.fillStyle = grad;
        ctx.fillRect(x, y, barWidth, barHeight);
      }
    }

    // Playback logic
    function playAudio() {
      setupWebAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audio.play();
      playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    }
    function pauseAudio() {
      audio.pause();
      playIcon.innerHTML = '<polygon points="6,4 20,12 6,20"></polygon>';
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    // Time update & sync
    let currentIndex = -1;
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const dur = audio.duration || 133.7;

      // Progress
      const pct = (cur / dur) * 100;
      progressFill.style.width = `${pct}%`;
      timeCurrent.textContent = formatTime(cur);

      // Find active lyric
      let activeIdx = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (cur >= lyricsData[i].start && cur < lyricsData[i].end) {
          activeIdx = i;
          break;
        }
      }

      if (activeIdx !== -1 && activeIdx !== currentIndex) {
        currentIndex = activeIdx;
        const activeItem = lyricsData[activeIdx];
        const nextItem = lyricsData[activeIdx + 1];

        heroBadge.textContent = `⚡ [ ${activeItem.badge} ]`;
        heroText.textContent = activeItem.text;
        heroNext.textContent = nextItem ? `Дальше: ${nextItem.text}` : "Финал трека";

        if (activeItem.type === 'chorus') {
          heroText.classList.add('chorus-mode');
        } else {
          heroText.classList.remove('chorus-mode');
        }

        // Highlight in stream
        document.querySelectorAll('.lyric-item').forEach((el, idx) => {
          if (idx === activeIdx) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            el.classList.remove('active');
          }
        });
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = formatTime(audio.duration);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * (audio.duration || 133.7);
    });
  </script>
</body>
</html>
